<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="CEArtola em realidade virtual: ranking, jogos e times na quadra">

<style>
:root{--acc:#910642;--gold:#f2a900;--ink:#f3ecef;--mut:#b3a2aa;--bg:#0b0809}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:28px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.8));pointer-events:none}
#hud>*{pointer-events:auto}
.t{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.3px}
.t b{color:#ff4f93}
.s{font-size:13px;color:var(--mut);flex:1 1 220px;line-height:1.35}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 18px;font:700 15px 'Figtree',sans-serif;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn.g{background:rgba(255,255,255,.14)}
.btn[hidden]{display:none}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
#load{position:fixed;inset:0;display:grid;place-items:center;font:700 17px 'Figtree',sans-serif;background:var(--bg);color:var(--mut);transition:opacity .4s}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="load">Entrando na quadra…</div>
<div id="hud">
  <span class="t">CEArtola <b>VR</b></span>
  <span class="s" id="msg">Arraste pra girar, pinça pra zoom, toque nos painéis.</span>
  <button class="btn" id="vrBtn" hidden>Entrar em VR</button>
  <a class="btn g" href="./">Voltar ao app</a>
</div>
<script type="module">
/* =====================================================================
   CEArtola VR — mesma base do app (Firebase Realtime Database), só leitura.
   Sem headset: vira uma visão 3D com toque/mouse.
   Com ?demo no endereço (ou aberto do computador) usa dados de teste.
   ===================================================================== */
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {XRControllerModelFactory} from 'three/addons/webxr/XRControllerModelFactory.js';

const DB_URL='https://fantasy-recreio-default-rtdb.firebaseio.com/.json';
const DEMO=location.protocol==='file:'||new URLSearchParams(location.search).has('demo');
const PTS={jogou:1,vitoria:2,gol:3,goleiroVitoria:3,craque:4}; // igual ao index.html
const ACC='#910642',ACC2='#d0306f',GOLD='#f2a900',INK='#f3ecef',MUT='#a3929a',GOOD='#2fbf8a';
const DISP='"Bricolage Grotesque","Arial Black",sans-serif',BODY='Figtree,system-ui,sans-serif';
const $=id=>document.getElementById(id);

/* ===================== DADOS ===================== */
let S={meta:null,jogadores:{},jogos:{},times:{},usuarios:{},pontos:{},rodadas:{}};
let loadErr=null,lastLoad=0;
async function load(){
  try{
    if(DEMO){if(!S.meta)S=demoData();}
    else{
      const r=await fetch(DB_URL,{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=(await r.json())||{};
      S={meta:d.meta||null,jogadores:d.jogadores||{},jogos:d.jogos||{},times:d.times||{},usuarios:d.usuarios||{},pontos:d.pontos||{},rodadas:d.rodadas||{}};
    }
    loadErr=null;lastLoad=Date.now();
  }catch(e){console.error(e);loadErr=navigator.onLine===false?'Sem conexão':'Não deu pra carregar ('+(e.message||e)+')';}
}

const R=()=>S.meta?S.meta.rodada||1:1;
const aberto=()=>!!S.meta&&S.meta.status==='aberto';
const J=id=>S.jogadores[id];
const pName=id=>J(id)?J(id).nome:'(removido)';
const rKey=r=>'r'+r;
const roundsDone=()=>Object.keys(S.rodadas||{}).map(k=>+k.slice(1)).filter(Boolean).sort((a,b)=>a-b);
function gamePts(g){
  const out={},win=g.pa>g.pb?'a':g.pb>g.pa?'b':null;
  ['a','b'].forEach(side=>Object.keys(g[side]||{}).forEach(pid=>{
    let p=PTS.jogou;if(win===side)p+=PTS.vitoria;p+=((g.gols||{})[pid]||0)*PTS.gol;
    if(win===side&&(side==='a'?g.ga:g.gb)===pid)p+=PTS.goleiroVitoria;if(g.craque===pid)p+=PTS.craque;out[pid]=(out[pid]||0)+p;}));
  return out;
}
const gamesOf=r=>Object.entries(S.jogos||{}).filter(([,g])=>g.r===r).sort((a,b)=>(a[1].data||'').localeCompare(b[1].data||'')||(a[1].ts||0)-(b[1].ts||0));
function roundPts(r){const pp={};gamesOf(r).forEach(([,g])=>{const gp=gamePts(g);for(const k in gp)pp[k]=(pp[k]||0)+gp[k];});return pp;}
const teamIds=t=>t?[t.gol].concat(t.linha||[]).filter(Boolean):[];
function teamPts(t,pp){if(!t)return 0;let s=0;teamIds(t).forEach(id=>s+=pp[id]||0);if(t.cap&&teamIds(t).includes(t.cap))s+=pp[t.cap]||0;return s;}
function seasonPts(pid){let p=0,j=0;roundsDone().forEach(r=>{const x=S.rodadas[rKey(r)]&&S.rodadas[rKey(r)].jog&&S.rodadas[rKey(r)].jog[pid];if(x){p+=x.pts||0;j+=x.j||0;}});return {p,j};}

function ranking(){
  const open=aberto(),pp=roundPts(R());
  return Object.entries(S.usuarios||{}).map(([uid,u])=>({uid,nome:u.nome||'?',total:(S.pontos[uid]||{}).total||0,
    parc:!open&&S.times[uid]?teamPts(S.times[uid],pp):null,team:S.times[uid]}))
    .sort((a,b)=>b.total-a.total||a.nome.localeCompare(b.nome));
}
function selecao(){
  let pp,label;const cur=roundPts(R());
  if(!aberto()&&Object.keys(cur).length){pp=cur;label=`Seleção da rodada ${R()} · ao vivo`;}
  else{const last=roundsDone().slice(-1)[0];if(!last)return null;
    pp=Object.fromEntries(Object.entries((S.rodadas[rKey(last)]||{}).jog||{}).map(([k,x])=>[k,x.pts||0]));label=`Seleção da rodada ${last}`;}
  const ids=Object.keys(pp).filter(id=>J(id)).sort((a,b)=>pp[b]-pp[a]);
  const gol=ids.find(id=>J(id).pos==='GOL')||null,linha=ids.filter(id=>J(id).pos!=='GOL').slice(0,4);
  if(!gol&&!linha.length)return null;
  const best=[gol,...linha].filter(Boolean).sort((a,b)=>pp[b]-pp[a])[0];
  return {label,team:{gol,linha,cap:best},pp};
}

/* o que aparece na quadra */
let view={mode:'sel',uid:null},hoverId=null,highView=false;
function courtModel(){
  if(view.mode==='uid'){
    const u=ranking().find(x=>x.uid===view.uid);
    if(u){
      if(aberto())return {title:u.nome,sub:'Os times ficam secretos até o mercado fechar.',team:null};
      if(!u.team)return {title:u.nome,sub:'Não salvou time nesta rodada.',team:null};
      const pp=roundPts(R()),has=Object.keys(pp).length;
      return {title:`Time de ${u.nome}`,sub:has?`Parcial da rodada ${R()}: ${teamPts(u.team,pp)} pts`:`Rodada ${R()}: nenhum jogo lançado ainda`,team:u.team,pp:has?pp:null,mult:true,starLabel:'C'};
    }
    view={mode:'sel',uid:null};
  }
  const s=selecao();
  if(!s)return {title:'Seleção da rodada',sub:'Ainda não tem jogo lançado.',team:null};
  return {title:s.label,sub:'Quem mais pontuou: 1 goleiro + 4 de linha',team:s.team,pp:s.pp,mult:false,starLabel:'★'};
}

/* ===================== CENA ===================== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.xr.enabled=true;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0809);
scene.fog=new THREE.Fog(0x0b0809,26,60);
const FOV=()=>innerWidth<innerHeight?82:60;
const camera=new THREE.PerspectiveCamera(FOV(),innerWidth/innerHeight,0.05,120);
const ORBIT_POS=()=>innerWidth<innerHeight?new THREE.Vector3(0,4.2,15.5):new THREE.Vector3(0,2.6,11.6);
camera.position.copy(ORBIT_POS());
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.4,3);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.47;controls.minDistance=3;controls.maxDistance=30;controls.update();

scene.add(new THREE.HemisphereLight(0xfff3f7,0x2a0c18,0.9));
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(6,14,8);scene.add(sun);

/* quadra: 24 x 13 m, linhas desenhadas num canvas */
const CW=24,CD=13;
(function court(){
  const px=50,c=document.createElement('canvas');c.width=(CW+2)*px;c.height=(CD+2)*px;const g=c.getContext('2d');
  g.fillStyle='#1a0710';g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#0b0b0b';g.fillRect(px,px,CW*px,CD*px);
  g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=6;
  g.strokeRect(px,px,CW*px,CD*px);
  g.beginPath();g.moveTo(c.width/2,px);g.lineTo(c.width/2,px+CD*px);g.stroke();
  g.beginPath();g.arc(c.width/2,c.height/2,3*px,0,Math.PI*2);g.stroke();
  g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(c.width/2,c.height/2,8,0,Math.PI*2);g.fill();
  [[px,1],[px+CW*px,-1]].forEach(([x,d])=>{g.beginPath();g.arc(x,c.height/2-1.5*px,5*px,d>0?-Math.PI/2:Math.PI/2*3,d>0?0:Math.PI,d<0);
    g.lineTo(x+d*5*px,c.height/2+1.5*px);g.arc(x,c.height/2+1.5*px,5*px,d>0?0:Math.PI,d>0?Math.PI/2:Math.PI/2,d<0);g.stroke();
    g.beginPath();g.arc(x+d*6*px,c.height/2,7,0,Math.PI*2);g.fill();});
  g.font=`800 ${1.1*px}px ${DISP}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(145,6,66,.85)';g.fillText('CEAT',c.width/2,c.height/2);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const m=new THREE.Mesh(new THREE.PlaneGeometry(CW+2,CD+2),new THREE.MeshStandardMaterial({map:tex,roughness:.55}));
  m.rotation.x=-Math.PI/2;scene.add(m);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x140910,roughness:1}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-0.01;scene.add(floor);
})();
/* gols */
(function goals(){
  const post=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4}),net=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.12,side:THREE.DoubleSide});
  [-1,1].forEach(d=>{const gr=new THREE.Group();const cyl=(h)=>new THREE.CylinderGeometry(.05,.05,h,10);
    [-1.5,1.5].forEach(z=>{const p=new THREE.Mesh(cyl(2),post);p.position.set(0,1,z);gr.add(p);});
    const bar=new THREE.Mesh(cyl(3.1),post);bar.rotation.x=Math.PI/2;bar.position.y=2;gr.add(bar);
    const box=new THREE.Mesh(new THREE.BoxGeometry(1,2,3),net);box.position.set(d*.5,1,0);gr.add(box);
    gr.position.x=d*CW/2;scene.add(gr);});
})();
/* arquibancada no fundo e nas laterais */
(function stands(){
  const mats=[new THREE.MeshStandardMaterial({color:0x3a0a1d,roughness:.9}),new THREE.MeshStandardMaterial({color:0x5a0f2e,roughness:.9})];
  for(let i=0;i<5;i++){
    const s=new THREE.Mesh(new THREE.BoxGeometry(CW+8,.5*(i+1),1),mats[i%2]);s.position.set(0,.25*(i+1),-CD/2-2-i);scene.add(s);
    [-1,1].forEach(d=>{const e=new THREE.Mesh(new THREE.BoxGeometry(1,.5*(i+1),CD+4),mats[i%2]);e.position.set(d*(CW/2+3+i),.25*(i+1),-1);scene.add(e);});
  }
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(60,14),new THREE.MeshStandardMaterial({color:0x1d0711}));wall.position.set(0,7,-CD/2-8);scene.add(wall);
  /* torcida de mentira: blocos coloridos */
  const geo=new THREE.BoxGeometry(.35,.55,.3),cols=[0x910642,0xf3ecef,0xf2a900,0xd0306f,0x6b5a63];
  const inst=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({roughness:.8}),220),m4=new THREE.Matrix4(),col=new THREE.Color();let n=0;
  for(let i=1;i<5&&n<220;i++)for(let x=-CW/2-3;x<CW/2+3&&n<220;x+=.9){if(Math.random()<.45)continue;
    m4.makeTranslation(x+Math.random()*.3,.5*(i+1)+.27,-CD/2-2-i);inst.setMatrixAt(n,m4);inst.setColorAt(n,col.setHex(cols[(Math.random()*cols.length)|0]));n++;}
  inst.count=n;scene.add(inst);
})();
/* bola no meio */
const ball=new THREE.Mesh(new THREE.IcosahedronGeometry(.18,1),new THREE.MeshStandardMaterial({color:0xffffff,flatShading:true,roughness:.5}));
ball.position.set(0,.18,0);scene.add(ball);

/* ---------- jogador (o "dolly" leva o usuário e os painéis) ---------- */
const USER_POS=new THREE.Vector3(0,0,CD/2+1.6),HIGH_POS=new THREE.Vector3(0,3.2,CD/2+5);
const dolly=new THREE.Group();dolly.position.copy(USER_POS);scene.add(dolly);

/* ===================== PAINÉIS (canvas → textura) ===================== */
const panels=[];
function makePanel(wPx,hPx,wM,pos,eyeH){
  const c=document.createElement('canvas');c.width=wPx;c.height=hPx;
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(wM,wM*hPx/wPx),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  mesh.position.copy(pos);dolly.add(mesh);mesh.lookAt(dolly.position.x,eyeH,dolly.position.z+.2);
  mesh.userData.panel={c,g:c.getContext('2d'),tex,regions:[]};panels.push(mesh);return mesh;
}
const rankP=makePanel(768,1024,1.5,new THREE.Vector3(-2.5,1.45,-.6),1.5);
const gamesP=makePanel(768,1024,1.5,new THREE.Vector3(2.5,1.45,-.6),1.5);
const boardP=makePanel(1024,420,2.2,new THREE.Vector3(0,2.6,-2.3),1.6);

function rr(g,x,y,w,h,r,fill){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();}
function fit(g,t,max){t=String(t);if(g.measureText(t).width<=max)return t;while(t.length>1&&g.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…';}
function base(P,title,sub){
  const {g,c}=P;g.clearRect(0,0,c.width,c.height);
  rr(g,0,0,c.width,c.height,36,'rgba(23,13,17,.94)');
  g.lineWidth=4;g.strokeStyle='rgba(208,48,111,.55)';g.beginPath();g.roundRect(2,2,c.width-4,c.height-4,34);g.stroke();
  g.textBaseline='alphabetic';g.textAlign='left';
  g.fillStyle=INK;g.font=`800 52px ${DISP}`;g.fillText(title,36,82);
  if(sub){g.fillStyle=MUT;g.font=`500 28px ${BODY}`;g.fillText(fit(g,sub,c.width-72),36,122);}
}
function button(P,id,x,y,w,h,label,primary,fn){
  const {g}=P,hov=hoverId===id;
  rr(g,x,y,w,h,h/2,primary?(hov?ACC2:ACC):(hov?'rgba(255,255,255,.24)':'rgba(255,255,255,.12)'));
  g.fillStyle='#fff';g.font=`700 30px ${BODY}`;g.textAlign='center';g.fillText(label,x+w/2,y+h/2+10);g.textAlign='left';
  P.regions.push({id,x,y,w,h,fn});
}

function drawRanking(){
  const P=rankP.userData.panel,{g,c}=P;P.regions=[];
  base(P,'Ranking geral',aberto()?'Mercado aberto':'Mercado fechado · parcial ao vivo');
  const list=ranking().slice(0,11);let y=152;
  if(!list.length){g.fillStyle=MUT;g.font=`500 32px ${BODY}`;g.fillText('Ninguém entrou ainda.',36,y+40);}
  list.forEach((u,i)=>{
    const id='u:'+u.uid,sel=view.mode==='uid'&&view.uid===u.uid,hov=hoverId===id;
    rr(g,24,y,c.width-48,66,16,sel?ACC:hov?'rgba(255,255,255,.14)':'rgba(255,255,255,.05)');
    g.fillStyle=i<3?GOLD:MUT;g.font=`800 34px ${DISP}`;g.textAlign='center';g.fillText(i+1,70,y+45);
    g.textAlign='left';g.fillStyle=INK;g.font=`700 32px ${BODY}`;g.fillText(fit(g,u.nome,c.width-360),110,y+44);
    g.textAlign='right';g.font=`800 36px ${DISP}`;g.fillText(u.total,c.width-50-(u.parc!=null?110:0),y+46);
    if(u.parc!=null){g.fillStyle=sel?'#fff':GOOD;g.font=`700 26px ${BODY}`;g.fillText('+'+u.parc,c.width-50,y+44);}
    g.textAlign='left';
    P.regions.push({id,x:24,y,w:c.width-48,h:66,fn:()=>{view={mode:'uid',uid:u.uid};redrawAll();buildSquad();}});
    y+=74;
  });
  g.fillStyle=MUT;g.font=`500 25px ${BODY}`;g.fillText(fit(g,'Aponte num nome pra ver o time na quadra.',c.width-72),36,c.height-34);
  P.tex.needsUpdate=true;
}

function drawGames(){
  const P=gamesP.userData.panel,{g,c}=P;P.regions=[];
  let r=R(),gs=gamesOf(r);
  if(!gs.length){const last=roundsDone().slice(-1)[0];if(last){r=last;gs=gamesOf(r);}}
  base(P,'Jogos',gs.length?`Rodada ${r}`:'Nenhum jogo lançado ainda');
  let y=150;
  gs.slice(-4).reverse().forEach(([,gm])=>{
    rr(g,24,y,c.width-48,118,18,'rgba(255,255,255,.05)');
    const d=(gm.data||'').split('-');g.fillStyle=MUT;g.font=`600 24px ${BODY}`;g.fillText(d.length===3?`${d[2]}/${d[1]}`:'',48,y+36);
    const win=gm.pa>gm.pb?'a':gm.pb>gm.pa?'b':null;
    g.textAlign='center';g.font=`800 50px ${DISP}`;g.fillStyle=INK;g.fillText(`${gm.pa} × ${gm.pb}`,c.width/2,y+64);
    g.font=`700 26px ${BODY}`;g.fillStyle=win==='a'?GOOD:MUT;g.fillText('Time A',c.width/2-200,y+60);g.fillStyle=win==='b'?GOOD:MUT;g.fillText('Time B',c.width/2+200,y+60);
    g.textAlign='left';
    const scorers=Object.entries(gm.gols||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).map(([id,n])=>pName(id)+(n>1?' ×'+n:'')).join(', ');
    g.fillStyle=MUT;g.font=`500 23px ${BODY}`;
    g.fillText(fit(g,(gm.craque?'★ '+pName(gm.craque)+'   ':'')+(scorers?'⚽ '+scorers:''),c.width-96),48,y+100);
    y+=130;
  });
  /* destaques da temporada */
  const top=Object.keys(S.jogadores).map(id=>({id,...seasonPts(id)})).filter(x=>x.j>0).sort((a,b)=>b.p-a.p).slice(0,5);
  const y0=Math.max(y+10,c.height-74-top.length*52-58);
  if(top.length){
    g.fillStyle=INK;g.font=`800 34px ${DISP}`;g.fillText('Destaques da temporada',36,y0+30);
    top.forEach((x,i)=>{const yy=y0+60+i*52;g.fillStyle=i===0?GOLD:INK;g.font=`700 29px ${BODY}`;
      g.fillText(fit(g,`${i+1}. ${pName(x.id)}`,c.width-280),36,yy+30);g.fillStyle=MUT;g.font=`500 25px ${BODY}`;g.textAlign='right';
      g.fillText(`${x.p} pts · ${x.j} jogo${x.j===1?'':'s'}`,c.width-36,yy+30);g.textAlign='left';});
  }
  P.tex.needsUpdate=true;
}

function drawBoard(){
  const P=boardP.userData.panel,{g,c}=P;P.regions=[];const m=courtModel();
  g.clearRect(0,0,c.width,c.height);rr(g,0,0,c.width,c.height,36,'rgba(23,13,17,.94)');
  g.lineWidth=4;g.strokeStyle='rgba(208,48,111,.55)';g.beginPath();g.roundRect(2,2,c.width-4,c.height-4,34);g.stroke();
  g.textAlign='left';g.fillStyle=MUT;g.font=`700 26px ${BODY}`;g.fillText(`CEARTOLA · RODADA ${R()}`,40,58);
  const st=aberto()?'MERCADO ABERTO':'MERCADO FECHADO';g.font=`700 24px ${BODY}`;const sw=g.measureText(st).width+36;
  rr(g,c.width-40-sw,30,sw,40,20,aberto()?'rgba(47,191,138,.2)':'rgba(242,169,0,.2)');g.fillStyle=aberto()?GOOD:GOLD;g.fillText(st,c.width-22-sw,58);
  g.fillStyle=INK;g.font=`800 60px ${DISP}`;g.fillText(fit(g,m.title,c.width-80),40,140);
  g.fillStyle=loadErr?'#ff6b6f':MUT;g.font=`500 30px ${BODY}`;g.fillText(fit(g,loadErr||m.sub,c.width-80),40,190);
  const bw=(c.width-80-40)/3;
  button(P,'b:sel',40,280,bw,84,'Seleção',view.mode==='sel',()=>{view={mode:'sel',uid:null};redrawAll();buildSquad();});
  button(P,'b:ref',60+bw,280,bw,84,'Atualizar',false,()=>refresh(true));
  button(P,'b:view',80+bw*2,280,bw,84,highView?'Descer':'Arquibancada',false,toggleView);
  P.tex.needsUpdate=true;
}
function redrawAll(){drawRanking();drawGames();drawBoard();}

/* ===================== JOGADORES NA QUADRA ===================== */
const squad=new THREE.Group();scene.add(squad);
const SLOTS=[[-6.5,0],[-3.4,0],[-.8,-3.2],[-.8,3.2],[2.6,0]]; // goleiro, fixo, ala, ala, pivô
const bodyGeo=new THREE.CapsuleGeometry(.28,.75,4,10),headGeo=new THREE.SphereGeometry(.2,16,12),legGeo=new THREE.CapsuleGeometry(.1,.45,3,8);
const mShirt=new THREE.MeshStandardMaterial({color:0x910642,roughness:.6}),mGk=new THREE.MeshStandardMaterial({color:0xf2a900,roughness:.6}),
  mSkin=new THREE.MeshStandardMaterial({color:0xe9d6c5,roughness:.8}),mShort=new THREE.MeshStandardMaterial({color:0x111111,roughness:.7}),
  mBand=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x3a2a00,roughness:.4}),
  mShadow=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.45,depthWrite:false});
function nameTag(nome,pos,pts,star){
  const c=document.createElement('canvas');c.width=512;c.height=200;const g=c.getContext('2d');
  rr(g,6,6,500,140,30,'rgba(15,8,11,.86)');g.lineWidth=4;g.strokeStyle=pos==='GOL'?GOLD:ACC2;g.beginPath();g.roundRect(6,6,500,140,30);g.stroke();
  g.textAlign='center';g.fillStyle=INK;g.font=`800 56px ${DISP}`;g.fillText(fit(g,nome,pts!=null?330:460),pts!=null?200:256,72);
  g.fillStyle=MUT;g.font=`700 26px ${BODY}`;g.fillText(pos==='GOL'?'GOLEIRO':'LINHA',pts!=null?200:256,120);
  if(pts!=null){rr(g,382,30,108,92,22,ACC);g.fillStyle='#fff';g.font=`800 48px ${DISP}`;g.fillText(pts,436,92);}
  if(star){g.beginPath();g.arc(450,166,30,0,Math.PI*2);g.fillStyle=GOLD;g.fill();g.fillStyle='#140b10';g.font=`800 34px ${DISP}`;g.fillText(star,450,178);}
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthWrite:false}));s.scale.set(1.9,.74,1);return s;
}
function figure(pid,pts,isCap,star){
  const p=J(pid)||{nome:'?',pos:'LINHA'},gk=p.pos==='GOL',gr=new THREE.Group();
  const body=new THREE.Mesh(bodyGeo,gk?mGk:mShirt);body.position.y=1.12;gr.add(body);
  const head=new THREE.Mesh(headGeo,mSkin);head.position.y=1.78;gr.add(head);
  [-.12,.12].forEach(x=>{const l=new THREE.Mesh(legGeo,mShort);l.position.set(x,.38,0);gr.add(l);});
  if(isCap){const band=new THREE.Mesh(new THREE.TorusGeometry(.3,.045,8,20),mBand);band.material=band.material.clone();band.material.color.set(0xf2a900);band.rotation.x=Math.PI/2;band.position.y=1.36;gr.add(band);}
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.42,20),mShadow);sh.rotation.x=-Math.PI/2;sh.position.y=.01;gr.add(sh);
  const tag=nameTag(p.nome,p.pos,pts,isCap?star:null);tag.position.y=2.55;gr.add(tag);
  gr.userData.phase=Math.random()*6;return gr;
}
function buildSquad(){
  squad.children.slice().forEach(o=>{squad.remove(o);o.traverse(x=>{if(x.isSprite){x.material.map.dispose();x.material.dispose();}});});
  const m=courtModel();if(!m.team)return;
  const ids=[m.team.gol,...(m.team.linha||[])];
  ids.forEach((pid,i)=>{if(!pid)return;
    const cap=m.team.cap===pid,pts=m.pp?(m.pp[pid]||0)*(m.mult&&cap?2:1):null;
    const f=figure(pid,pts,cap,m.starLabel);f.position.set(SLOTS[i][0],0,SLOTS[i][1]);f.userData.base=f.position.clone();
    f.userData.t0=performance.now()/1000;squad.add(f);});
}

/* ===================== INTERAÇÃO ===================== */
const ray=new THREE.Raycaster(),tmpM=new THREE.Matrix4();
function hitTest(){
  const hits=ray.intersectObjects(panels,false);if(!hits.length)return {dist:null,reg:null};
  const h=hits[0],P=h.object.userData.panel,x=h.uv.x*P.c.width,y=(1-h.uv.y)*P.c.height;
  return {dist:h.distance,point:h.point,reg:P.regions.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)||null};
}
function setHover(id){if(hoverId!==id){hoverId=id;redrawAll();}}
/* toque / mouse */
const ndc=new THREE.Vector2();let down=null;
function fromEvent(e){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);return hitTest();}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
  if(moved>8||renderer.xr.isPresenting)return;const h=fromEvent(e);if(h.reg)h.reg.fn();});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||renderer.xr.isPresenting)return;const h=fromEvent(e);
  setHover(h.reg?h.reg.id:null);renderer.domElement.style.cursor=h.reg?'pointer':'';});

/* controles VR */
const ctls=[],factory=new XRControllerModelFactory();
const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]);
const dotGeo=new THREE.SphereGeometry(.015,10,8);
for(let i=0;i<2;i++){
  const ctl=renderer.xr.getController(i);
  const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xff4f93,transparent:true,opacity:.8}));line.scale.z=6;ctl.add(line);
  const dot=new THREE.Mesh(dotGeo,new THREE.MeshBasicMaterial({color:0xffffff}));dot.visible=false;scene.add(dot);
  ctl.userData={line,dot,reg:null};
  ctl.addEventListener('select',()=>{aimFrom(ctl);const h=hitTest();if(h.reg)h.reg.fn();});
  ctl.addEventListener('connected',e=>{line.visible=e.data.targetRayMode!=='gaze';});
  dolly.add(ctl);ctls.push(ctl);
  const grip=renderer.xr.getControllerGrip(i);grip.add(factory.createControllerModel(grip));dolly.add(grip);
}
function aimFrom(ctl){tmpM.identity().extractRotation(ctl.matrixWorld);ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(tmpM);}
function xrHover(){
  let hov=null;
  ctls.forEach(ctl=>{const u=ctl.userData;aimFrom(ctl);const h=hitTest();
    if(h.dist!=null){u.line.scale.z=h.dist;u.dot.visible=true;u.dot.position.copy(h.point);if(h.reg)hov=h.reg.id;}
    else{u.line.scale.z=6;u.dot.visible=false;}});
  setHover(hov);
}

/* visão: beira da quadra ou arquibancada */
function toggleView(){highView=!highView;dolly.position.copy(highView?HIGH_POS:USER_POS);
  if(!renderer.xr.isPresenting){const d=highView?new THREE.Vector3(0,3.2,3.4):new THREE.Vector3();camera.position.copy(ORBIT_POS()).add(d);controls.target.set(0,1.4+(highView?3.2:0),3+(highView?3.4:0));controls.update();}
  drawBoard();}

/* entrar em VR */
const vrBtn=$('vrBtn');let savedCam=null;
(async()=>{
  let ok=false;try{ok=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-vr'));}catch(e){}
  if(ok){vrBtn.hidden=false;$('msg').textContent='Coloque o headset e toque em Entrar em VR. No VR, aponte e aperte o gatilho.';}
  else $('msg').textContent=(window.isSecureContext?'Este navegador não tem WebXR (iPhone/iPad não têm). Abra no navegador do Quest ou no Vision Pro. Aqui dá pra ver em 3D: arraste pra girar e toque nos painéis.':'O WebXR precisa de https (ex.: GitHub Pages). Aqui dá pra ver em 3D.');
})();
vrBtn.onclick=async()=>{
  try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
    renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(s);}
  catch(e){console.error(e);$('msg').textContent='Não deu pra abrir o VR: '+(e.message||e);}
};
renderer.xr.addEventListener('sessionstart',()=>{savedCam={p:camera.position.clone(),t:controls.target.clone()};controls.enabled=false;
  dolly.add(camera);camera.position.set(0,0,0);camera.rotation.set(0,0,0);$('hud').style.visibility='hidden';});
renderer.xr.addEventListener('sessionend',()=>{scene.add(camera);controls.enabled=true;ctls.forEach(c=>c.userData.dot.visible=false);
  if(savedCam){camera.position.copy(savedCam.p);controls.target.copy(savedCam.t);}controls.update();setHover(null);$('hud').style.visibility='';});

addEventListener('resize',()=>{camera.fov=FOV();camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ===================== LOOP ===================== */
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime();
  squad.children.forEach(f=>{f.position.y=Math.abs(Math.sin(t*2.2+f.userData.phase))*.06;f.rotation.y=Math.sin(t*.7+f.userData.phase)*.25;});
  ball.position.x=Math.sin(t*.6)*1.2;ball.position.z=Math.cos(t*.45)*.8;ball.rotation.z-=.03;ball.rotation.x+=.02;
  if(renderer.xr.isPresenting)xrHover();else controls.update();
  renderer.render(scene,camera);
});

/* atualiza sozinho a cada 30 s (o app grava no mesmo banco) */
async function refresh(force){
  if(!force&&Date.now()-lastLoad<25000)return;
  await load();redrawAll();buildSquad();
}
setInterval(()=>refresh(false),30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(false);});

/* ===================== INÍCIO ===================== */
(async()=>{
  try{await Promise.race([Promise.all([document.fonts.load(`800 40px ${DISP}`),document.fonts.load(`700 30px ${BODY}`),document.fonts.load(`500 30px ${BODY}`)]),new Promise(r=>setTimeout(r,2500))]);}catch(e){}

/* ===================== DEMO ===================== */
function demoData(){
  let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const SEED=[['Rafael','LINHA','3º ano'],['Felipe','LINHA','3º ano'],['Ian','LINHA','3º ano'],['Caetano','GOL','3º ano'],['Casao','LINHA','3º ano'],
    ['Ernesto A.','LINHA','3º ano'],['Ernesto T.','LINHA','3º ano'],['Vicente','LINHA','3º ano'],['Luiz Paulo','LINHA','3º ano'],['Bayao','LINHA','3º ano'],
    ['Levi','GOL','2º ano'],['Luiz A.','LINHA','2º ano'],['Renan','LINHA','2º ano'],['Mateus','LINHA','2º ano'],
    ['Arthur','LINHA','1º ano'],['Pedro','LINHA','1º ano'],['Tales','LINHA','1º ano'],['Sofia','GOL','1º ano'],['Guilherme','LINHA','1º ano'],['Bruno','GOL','1º ano'],['Isa','LINHA','1º ano']];
  const jog={};SEED.forEach(([nome,pos,ano],i)=>jog['p'+i]={nome,pos,ano,preco:6+((i*7)%9),ativo:true});
  const gks=Object.keys(jog).filter(k=>jog[k].pos==='GOL'),lin=Object.keys(jog).filter(k=>jog[k].pos!=='GOL');
  const shuf=a=>a.slice().sort(()=>rnd()-.5);
  const jogos={};let n=0;
  function game(r,data){const g=shuf(gks),l=shuf(lin),a={},b={},gols={};
    [g[0],...l.slice(0,4)].forEach(id=>a[id]=true);[g[1],...l.slice(4,8)].forEach(id=>b[id]=true);
    let pa=0,pb=0;l.slice(0,8).forEach((id,i)=>{const k=rnd()<.35?(rnd()<.3?2:1):0;if(k){gols[id]=k;if(i<4)pa+=k;else pb+=k;}});
    const craque=Object.keys(gols).sort((x,y)=>gols[y]-gols[x])[0]||l[0];
    jogos['g'+(n++)]={r,data,a,b,pa,pb,gols,ga:g[0],gb:g[1],craque,ts:n};}
  game(1,'2026-10-20');game(1,'2026-10-21');game(1,'2026-10-23');game(2,'2026-10-27');game(2,'2026-10-29');
  S={meta:{rodada:2,status:'fechado',orc:55},jogadores:jog,jogos,times:{},usuarios:{},pontos:{},rodadas:{}};
  const pp1={},jc={};gamesOf(1).forEach(([,g])=>{const gp=gamePts(g);for(const k in gp){pp1[k]=(pp1[k]||0)+gp[k];jc[k]=(jc[k]||0)+1;}});
  S.rodadas.r1={jog:Object.fromEntries(Object.keys(pp1).map(k=>[k,{pts:pp1[k],j:jc[k]}]))};
  ['Rafa','Ana','Beto','Caio','Duda','Gabi','Leo','Nina','Theo'].forEach((nome,i)=>{const uid='u'+i,l=shuf(lin).slice(0,4);
    const t={gol:shuf(gks)[0],linha:l,cap:l[0]};S.usuarios[uid]={nome};S.times[uid]=t;const p=teamPts(t,pp1);S.pontos[uid]={total:p,r1:p};});
  return S;
}
